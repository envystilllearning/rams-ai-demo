<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 640px;
    font-family: 'Segoe UI', Inter, system-ui, sans-serif;
    background: #0B1F3A;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .glow {
    position: absolute; width: 700px; height: 700px; right: -150px; top: -150px;
    background: radial-gradient(circle, rgba(245,158,11,0.22) 0%, transparent 65%);
  }
  .grid { position: absolute; inset: 0; opacity: 0.05;
    background-image: linear-gradient(#fff 1px, transparent 1px),
      linear-gradient(90deg, #fff 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .inner { display: flex; gap: 64px; align-items: center; z-index: 1; padding: 0 72px; }
  .badge {
    display: inline-block; background: #F59E0B; color: #78350F;
    font-size: 20px; font-weight: 700; letter-spacing: 2px;
    padding: 8px 20px; border-radius: 999px; margin-bottom: 24px;
  }
  h1 { font-size: 92px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
  h1 span { color: #F59E0B; }
  p.tag { font-size: 28px; color: #CBD5E1; margin-top: 20px; max-width: 560px; line-height: 1.4; }
  .stack { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; max-width: 560px; }
  .stack span {
    font-size: 17px; border: 1px solid rgba(255,255,255,0.25);
    padding: 6px 14px; border-radius: 999px; color: #E2E8F0;
  }
  .doc {
    width: 340px; background: #fff; color: #0F172A; border-radius: 20px;
    padding: 32px 30px; box-shadow: 0 30px 80px rgba(0,0,0,0.45);
    transform: rotate(3deg);
  }
  .doc .row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .doc .logo { width: 38px; height: 38px; border-radius: 10px; background: #0B1F3A;
    color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .doc .t1 { font-weight: 700; font-size: 19px; }
  .doc .t2 { font-size: 14px; color: #64748B; }
  .pill { display: inline-block; font-size: 14px; font-weight: 700; border-radius: 999px; padding: 4px 14px; }
  .pill.g { background: #DCFCE7; color: #16A34A; }
  .bar { height: 12px; border-radius: 6px; background: #E2E8F0; margin: 10px 0; }
  .bar.a { background: #F59E0B; width: 82%; }
  .bar.b { width: 64%; } .bar.c { width: 74%; }
  .btns { display: flex; gap: 10px; margin-top: 18px; }
  .btn { font-size: 15px; font-weight: 700; border-radius: 10px; padding: 10px 18px; }
  .btn.o { border: 2px solid #E2E8F0; color: #64748B; }
  .btn.s { background: #0B1F3A; color: #fff; }
  .float {
    position: absolute; background: #fff; color: #0F172A; font-weight: 700;
    border-radius: 12px; padding: 10px 18px; font-size: 17px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
  }
  .f1 { top: 96px; right: 120px; }
  .f2 { bottom: 100px; right: 400px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="float f1">⚡ Generated in 42s</div>
  <div class="float f2">📄 Word + PDF</div>
  <div class="inner">
    <div>
      <div class="badge">FULL-STACK SAAS DEMO</div>
      <h1>RAMS <span>AI</span></h1>
      <p class="tag">AI-assisted Risk Assessments &amp; Method Statements for UK construction — from form to Word + PDF in minutes.</p>
      <div class="stack">
        <span>Next.js 15</span><span>FastAPI</span><span>Supabase</span>
        <span>Stripe-ready</span><span>OpenRouter</span><span>pytest · 43 passed</span>
      </div>
    </div>
    <div class="doc">
      <div class="row">
        <div class="logo">R</div>
        <div><div class="t1">RAMS-000123</div><div class="t2">Rev 01 · Riverside Warehouse</div></div>
        <div style="margin-left:auto"><span class="pill g">Ready</span></div>
      </div>
      <div class="bar a"></div>
      <div class="bar b"></div>
      <div class="bar c"></div>
      <div class="bar b"></div>
      <div class="btns"><div class="btn o">⭳ DOCX</div><div class="btn s">⭳ PDF</div></div>
    </div>
  </div>
</body>
</html>
